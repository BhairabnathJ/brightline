[project]
name = "brightline"
version = "0.1.0"
description = "Brightline Logistics — SideQuest practice sandbox (shipments, drivers, routes)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "SQLAlchemy==2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks a test as deliberately slow (the strictly-slowest test in the suite)",
]
